name: CI

on:
  push:
    branches: ["v2-rebuild", "main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────
  # Backend: Lint + Type Check + Tests
  # ─────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint with Ruff
        run: ruff check backend/app/ --select=E,F,W --ignore=E501

      - name: Run unit tests with coverage
        run: |
          pytest backend/tests/unit/ -v --cov=backend/app --cov-report=term-missing
        env:
          # Secrets injected from GitHub Actions repository secrets
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ─────────────────────────────────────
  # Frontend: Type Check + Build
  # ─────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend
